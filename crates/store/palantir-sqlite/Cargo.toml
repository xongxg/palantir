[package]
name = "palantir-sqlite"
version = "0.1.0"
edition = "2024"

[dependencies]
palantir-meta-store = { path = "../palantir-meta-store" }
sqlx        = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
uuid        = { version = "1", features = ["v4"] }
async-trait = "0.1"
